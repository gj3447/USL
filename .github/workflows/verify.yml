name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          # Architecture source locators are checked against a pinned Git commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-standards.txt

      - run: npm ci
      - run: python3 -m pip install --requirement scripts/requirements-standards.txt

      # lean-action reads lean/lean-toolchain, which pins Lean itself.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: "true"
          test: "false"
          lint: "false"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check-docs.py
      - run: python3 -B scripts/test_install_workspace_linking_rules.py
      - run: python3 -B scripts/test_sync_github_workspace_rules.py
      - run: npm run test:lean
      - run: npm run test:standards
      - run: npm run rule-policy:check
      - run: npm run rule-policy:standards
      - run: npm run rule-weight-review:check
      - run: npm run rule-weight-evidence:check
      - run: npm run rule-weight-evidence:standards
      - run: npm run engineering:check
      - run: npm run engineering:standards
      - run: npm run binding-progress:check
      - run: npm run binding-progress:standards
      - run: node --import tsx scripts/build-portability-plan.ts --check
      - run: python3 scripts/validate-portability-plan.py
      - run: npm run portable-transfer:check
      - run: npm run portable-transfer:standards
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --skipLibCheck scripts/build-portability-research.ts
      - run: node --import tsx scripts/build-portability-research.ts --check
      - run: python3 scripts/validate-portability-research.py
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --skipLibCheck --types node scripts/build-standards-coverage.ts
      - run: node --import tsx scripts/build-standards-coverage.ts --check
      - run: python3 scripts/validate-standards-coverage.py
      - run: python3 scripts/audit-worktrees.py --check
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --skipLibCheck --types node scripts/build-development-plan.ts
      - run: node --import tsx scripts/build-development-plan.ts --check
      - run: python3 scripts/validate-development-plan.py
      - run: python3 scripts/record-development-progress.py --check
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --skipLibCheck --types node scripts/usl-transfer-export.ts
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --skipLibCheck --types node scripts/usl-transfer-import.ts scripts/measure-portable-transfer.ts scripts/portable-transfer-acceptance.ts
      - run: node --import tsx scripts/build-syntax-cli-architecture.ts --check
      - run: python3 scripts/validate-syntax-cli-architecture.py
