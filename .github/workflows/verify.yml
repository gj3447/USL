name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-standards.txt

      - run: npm ci
      - run: python3 -m pip install --requirement scripts/requirements-standards.txt

      # lean-action reads lean/lean-toolchain, which pins Lean itself.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: "true"
          test: "false"
          lint: "false"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check-docs.py
      - run: npm run test:lean
      - run: npm run test:standards
      - run: npm run engineering:check
      - run: npm run engineering:standards
